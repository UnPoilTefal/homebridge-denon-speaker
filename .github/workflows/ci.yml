name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  check:
    name: Lint · Test · Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint src/ --ext .ts

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Verdict unique, a nom fixe, pour le ruleset.
  #
  # Exiger directement les jobs de matrice rendrait le depot immergeable le
  # jour ou Renovate retire une version de Node : le check requis
  # « Lint · Test · Build (Node 18.x) » ne serait plus jamais rapporte, et
  # rien ne signalerait pourquoi plus aucune PR ne passe.
  #
  # « if: always() » est indispensable : sans lui ce job est *skipped* quand
  # la matrice echoue, le check requis n'est alors jamais rapporte, et
  # l'echec se presente comme une attente indefinie plutot que comme un echec.
  verdict:
    name: Verdict
    runs-on: ubuntu-latest
    needs: [check]
    if: always()
    steps:
      - name: La matrice est-elle verte ?
        run: |
          echo "resultat de la matrice : ${{ needs.check.result }}"
          if [ "${{ needs.check.result }}" != "success" ]; then
            echo "::error::la matrice n'est pas verte"
            exit 1
          fi
